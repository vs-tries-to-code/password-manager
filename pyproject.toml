[project]
name = "subrosa"
version = "0.1.0"
description = "A terminal-based secure password manager using SQLite and Fernet encryption."
requires-python = ">=3.9"
dependencies = [
    "bcrypt>=4.0.0",
    "cryptography>=41.0.0",
    "pyfiglet>=1.0.4",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[project.scripts]
# This links the terminal command to your main function
subrosa = "subrosa.app:main"

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
