[project]
name = "term-passmanager"
version = "0.1.0"
description = "A terminal-based secure password manager using SQLite and Fernet encryption."
dependencies = [
    "bcrypt>=4.0.0",
    "cryptography>=41.0.0",
]

[project.scripts]
# This links the terminal command to your main function
term-pass = "app:main"

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"